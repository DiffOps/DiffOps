services:
  app:
    build:
      context: .
      dockerfile: .docker/app.Dockerfile
    volumes:
      - .:/var/www
    working_dir: /var/www
    expose:
      - "9000"
    command: php-fpm
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    volumes:
      - ./:/var/www:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_started
      node:
        condition: service_completed_successfully

  node:
    image: node:24-alpine
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: sh -c "npm install && npm run build"
    restart: "no"
    profiles: []

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  horizon:
    build:
      context: .
      dockerfile: .docker/horizon.Dockerfile
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: sh -c "composer install --no-interaction && php artisan horizon"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped