name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, dom, bcmath, pcntl
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: LARAVEL_BYPASS_ENV_CHECK=1 npm run test
      - run: vendor/bin/pint --test
      - run: php artisan test --env=testing --configuration=phpunit.xml --no-coverage
        env:
          APP_KEY: base64:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
